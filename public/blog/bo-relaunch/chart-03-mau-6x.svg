<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Nunito', system-ui, sans-serif">
  <rect x="0" y="0" width="800" height="500" rx="24" fill="#F7F4E3"/>

  <text x="48" y="52" font-family="'Fraunces', Georgia, serif" font-size="30" fill="#251F1A">Monthly active users grew 6× in six months</text>
  <text x="48" y="76" font-size="15" fill="#251F1A" fill-opacity="0.55">Unique app visitors per month · Dec 2025 to May 2026</text>

  <line x1="70" y1="410" x2="770" y2="410" stroke="#251F1A" stroke-opacity="0.15" stroke-width="1"/>

  <!-- bars: max 15000 -> 300px tall, baseline y=410 -->
  <!-- Dec 2237 h44.7 -> top 365.3 -->
  <rect x="92"  y="365.3" width="86" height="44.7"  rx="7" fill="#FFBC14" fill-opacity="0.45"/>
  <text x="135" y="356" text-anchor="middle" font-size="14" fill="#251F1A" fill-opacity="0.7">2,237</text>
  <text x="135" y="432" text-anchor="middle" font-size="13" fill="#251F1A" fill-opacity="0.6">Dec '25</text>

  <!-- Jan 5402 h108 -> top 302 -->
  <rect x="205" y="302"   width="86" height="108"   rx="7" fill="#FFBC14" fill-opacity="0.55"/>
  <text x="248" y="293" text-anchor="middle" font-size="14" fill="#251F1A" fill-opacity="0.7">5,402</text>
  <text x="248" y="432" text-anchor="middle" font-size="13" fill="#251F1A" fill-opacity="0.6">Jan</text>

  <!-- Feb 6697 h133.9 -> top 276.1 -->
  <rect x="318" y="276.1" width="86" height="133.9" rx="7" fill="#FFBC14" fill-opacity="0.65"/>
  <text x="361" y="267" text-anchor="middle" font-size="14" fill="#251F1A" fill-opacity="0.7">6,697</text>
  <text x="361" y="432" text-anchor="middle" font-size="13" fill="#251F1A" fill-opacity="0.6">Feb</text>

  <!-- Mar 6659 h133.2 -> top 276.8 -->
  <rect x="431" y="276.8" width="86" height="133.2" rx="7" fill="#FFBC14" fill-opacity="0.65"/>
  <text x="474" y="267" text-anchor="middle" font-size="14" fill="#251F1A" fill-opacity="0.7">6,659</text>
  <text x="474" y="432" text-anchor="middle" font-size="13" fill="#251F1A" fill-opacity="0.6">Mar</text>

  <!-- Apr 11800 h236 -> top 174 -->
  <rect x="544" y="174"   width="86" height="236"   rx="7" fill="#FFBC14" fill-opacity="0.8"/>
  <text x="587" y="165" text-anchor="middle" font-size="14" fill="#251F1A" fill-opacity="0.8">11,800</text>
  <text x="587" y="432" text-anchor="middle" font-size="13" fill="#251F1A" fill-opacity="0.6">Apr</text>

  <!-- May 14718 h294.4 -> top 115.6 (emphasis) -->
  <rect x="657" y="115.6" width="86" height="294.4" rx="7" fill="#FFBC14"/>
  <text x="700" y="106" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="20" fill="#251F1A">14,718</text>
  <text x="700" y="432" text-anchor="middle" font-size="13" fill="#251F1A" font-weight="600">May '26</text>

  <!-- 6x arc -->
  <path d="M 135,345 C 300,250 560,250 700,150" fill="none" stroke="#1D4B3A" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="5 5"/>
  <text x="420" y="252" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="22" fill="#1D4B3A">6×</text>

  <text x="48" y="478" font-size="12.5" fill="#251F1A" fill-opacity="0.5">Active-user tracking is clean only from Dec 2025 on. June 2026 omitted (partial month).</text>
</svg>
