<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Nunito', system-ui, sans-serif">
  <rect x="0" y="0" width="800" height="500" rx="24" fill="#F7F4E3"/>

  <text x="48" y="52" font-family="'Fraunces', Georgia, serif" font-size="30" fill="#251F1A">The retention curve, before and after</text>
  <text x="48" y="76" font-size="15" fill="#251F1A" fill-opacity="0.55">Share of a signup cohort returning in each following week · same definition on both lines</text>

  <g stroke="#251F1A" stroke-opacity="0.10" stroke-width="1">
    <line x1="86" y1="326" x2="770" y2="326"/>
    <line x1="86" y1="252" x2="770" y2="252"/>
    <line x1="86" y1="178" x2="770" y2="178"/>
    <line x1="86" y1="400" x2="770" y2="400"/>
  </g>
  <g font-size="12" fill="#251F1A" fill-opacity="0.45" text-anchor="end">
    <text x="76" y="330">2.5%</text>
    <text x="76" y="256">5%</text>
    <text x="76" y="182">7.5%</text>
  </g>
  <path fill="none" stroke="#1D4B3A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" d="M 110,234.2 L 262,337.8 L 414,370.4 L 566,382.2 L 718,385.2"/>
  <path fill="none" stroke="#FFBC14" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" d="M 110,130.6 L 262,284.6 L 414,340.8"/>
  <circle cx="110" cy="130.6" r="6" fill="#FFBC14" stroke="#F7F4E3" stroke-width="2"/>
  <text x="110" y="112.6" text-anchor="middle" font-size="14" fill="#251F1A" fill-opacity="0.85">9.1%</text>
  <circle cx="262" cy="284.6" r="6" fill="#FFBC14" stroke="#F7F4E3" stroke-width="2"/>
  <text x="262" y="266.6" text-anchor="middle" font-size="14" fill="#251F1A" fill-opacity="0.85">3.9%</text>
  <circle cx="414" cy="340.8" r="6" fill="#FFBC14" stroke="#F7F4E3" stroke-width="2"/>
  <text x="414" y="322.8" text-anchor="middle" font-size="14" fill="#251F1A" fill-opacity="0.85">2.0%</text>
  <circle cx="110" cy="234.2" r="6" fill="#1D4B3A" stroke="#F7F4E3" stroke-width="2"/>
  <text x="110" y="262.2" text-anchor="middle" font-size="14" fill="#251F1A" fill-opacity="0.85">5.6%</text>
  <circle cx="262" cy="337.8" r="6" fill="#1D4B3A" stroke="#F7F4E3" stroke-width="2"/>
  <text x="262" y="365.8" text-anchor="middle" font-size="14" fill="#251F1A" fill-opacity="0.85">2.1%</text>
  <circle cx="414" cy="370.4" r="6" fill="#1D4B3A" stroke="#F7F4E3" stroke-width="2"/>
  <text x="414" y="398.4" text-anchor="middle" font-size="14" fill="#251F1A" fill-opacity="0.85">1.0%</text>
  <circle cx="566" cy="382.2" r="6" fill="#1D4B3A" stroke="#F7F4E3" stroke-width="2"/>
  <text x="566" y="410.2" text-anchor="middle" font-size="14" fill="#251F1A" fill-opacity="0.85">0.6%</text>
  <circle cx="718" cy="385.2" r="6" fill="#1D4B3A" stroke="#F7F4E3" stroke-width="2"/>
  <text x="718" y="413.2" text-anchor="middle" font-size="14" fill="#251F1A" fill-opacity="0.85">0.5%</text>
  <g transform="translate(452,110)">
    <line x1="0" y1="-5" x2="26" y2="-5" stroke="#FFBC14" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="13" cy="-5" r="5.5" fill="#FFBC14" stroke="#F7F4E3" stroke-width="2"/>
    <text x="40" y="0" font-size="15" fill="#251F1A" font-weight="600">After the rewrite</text>
    <text x="40" y="20" font-size="12.5" fill="#251F1A" fill-opacity="0.55">cohorts Jun 28 to Jul 11 · n = 3,283</text>
    <line x1="0" y1="47" x2="26" y2="47" stroke="#1D4B3A" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round"/>
    <circle cx="13" cy="47" r="5.5" fill="#1D4B3A" stroke="#F7F4E3" stroke-width="2"/>
    <text x="40" y="52" font-size="15" fill="#1D4B3A" font-weight="600">Before the rewrite</text>
    <text x="40" y="72" font-size="12.5" fill="#1D4B3A" fill-opacity="0.7">cohorts May 10 to May 30 · n = 5,717</text>
  </g>
  <g font-size="13" fill="#251F1A" fill-opacity="0.6" text-anchor="middle">
    <text x="110" y="428">Week 1</text>
    <text x="262" y="428">Week 2</text>
    <text x="414" y="428">Week 3</text>
    <text x="566" y="428">Week 4</text>
    <text x="718" y="428">Week 5</text>
  </g>

  <text x="48" y="461" font-size="12.5" fill="#251F1A" fill-opacity="0.5">Roughly double at every week we can observe. Weeks 4 and 5 have not happened yet for the later cohorts.</text>
  <text x="48" y="478" font-size="12.5" fill="#251F1A" fill-opacity="0.5">Cohort sizes fall over this period, so a shift in who signs up is not ruled out.</text>
</svg>
