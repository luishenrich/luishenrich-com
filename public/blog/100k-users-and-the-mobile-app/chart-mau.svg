  <text x="371" y="275.1" text-anchor="middle" font-size="13" fill="#251F1A" fill-opacity="0.8">6,659</text>
  <text x="371" y="432" text-anchor="middle" font-size="12.5" fill="#251F1A" fill-opacity="0.6">Mar</text>
