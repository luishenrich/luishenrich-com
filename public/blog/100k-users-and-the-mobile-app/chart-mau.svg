  <text x="197" y="298.7" text-anchor="middle" font-size="13" fill="#251F1A" fill-opacity="0.8">5,402</text>
  <text x="197" y="432" text-anchor="middle" font-size="12.5" fill="#251F1A" fill-opacity="0.6">Jan</text>
  <rect x="252" y="284.4" width="64" height="125.6" rx="7" fill="#FFBC14" fill-opacity="0.85"/>
